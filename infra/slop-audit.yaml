AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Slop Audit public web app on ECS Fargate: one task (the scanner runs one scan
  at a time by design) behind an internet-facing ALB with an ACM certificate,
  reports and feedback on EFS, images in a private ECR repository pushed by
  GitHub Actions through the account's GitHub OIDC provider. Fargate is used
  because the account's EC2 on-demand vCPU quota is 1 and already in use.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Site }
        Parameters: [DomainName]
      - Label: { default: Network }
        Parameters: [VpcId, SubnetIds]
      - Label: { default: Compute }
        Parameters: [TaskCpu, TaskMemory, DesiredCount]
      - Label: { default: Deploys }
        Parameters: [GitHubRepo, GitHubRepoImmutable]

Parameters:
  DomainName:
    Type: String
    Description: Hostname the site answers on, e.g. slopaudit.skilak.ai. Needs two DNS records; scripts/deploy.sh prints them.
    AllowedPattern: ^[a-z0-9.-]+\.[a-z]{2,}$
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets in different AZs (ALB requirement). Tasks get a public IP to reach ECR and the sites they scan.
  TaskCpu:
    Type: Number
    Default: 1024
    AllowedValues: [1024, 2048]
  TaskMemory:
    Type: Number
    Default: 4096
    AllowedValues: [3072, 4096, 6144, 8192]
    Description: Chromium with full-page screenshots wants 3 GB or more.
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]
    Description: 0 until the first image exists in the repository; the deploy workflow sets it to 1.
  GitHubRepo:
    Type: String
    Default: SkilakLabs/slop-audit
  GitHubRepoImmutable:
    Type: String
    Description: The same repository in GitHub's immutable subject form (owner@id/repo@id); scripts/deploy.sh computes it. Organizations may issue tokens with this form, so both are trusted.
  OperatorPrincipalArn:
    Type: String
    Default: ""
    Description: IAM role or user allowed to assume the operator role, which may run this task definition once with a command override (for example to edit the hidden-hosts file). Empty creates no operator role.

Conditions:
  HasOperator: !Not [!Equals [!Ref OperatorPrincipalArn, ""]]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Metadata:
      com.aws.cloudformation.Context:
        why: TLS on the ALB. DNS validation so the zone can live at any DNS host, not only Route 53; the stack waits until the validation CNAME exists.
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS

  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Fixed name because .github/workflows/deploy.yml pushes to it by name.
    Properties:
      RepositoryName: !Sub "${AWS::StackName}"
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Reports, screenshots and feedback.jsonl outlive any task. Retained on stack deletion; it is the only copy.
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      FileSystemTags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-data" }

  AccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser: { Uid: "1000", Gid: "1000" }
      RootDirectory:
        Path: /slop-audit
        CreationInfo: { OwnerUid: "1000", OwnerGid: "1000", Permissions: "750" }

  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroups: [!Ref EfsSecurityGroup]
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Select [1, !Ref SubnetIds]
      SecurityGroups: [!Ref EfsSecurityGroup]

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: A public website. 80 only redirects to 443.
    Properties:
      GroupDescription: Slop Audit ALB (HTTP, HTTPS from anywhere)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP redirect }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Slop Audit task (app port from the ALB only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 4100, ToPort: 4100, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: From ALB }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: The scanner must reach any public website }
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Slop Audit EFS (NFS from the task only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref TaskSecurityGroup, Description: NFS from task }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 4100
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "10" }
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref Certificate }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}"

  ExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: ECS pulls the image and writes logs with this role; the app never sees it.
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: The app itself needs no AWS API. The only grant is ECS Exec (a shell for reading feedback.jsonl) and the EFS mount.
        must: Never add S3 or other data permissions here; the container runs code that loads untrusted websites.
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: exec-and-efs
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [ssmmessages:CreateControlChannel, ssmmessages:CreateDataChannel, ssmmessages:OpenControlChannel, ssmmessages:OpenDataChannel]
                Resource: "*"
              - Effect: Allow
                Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
                Resource: !GetAtt FileSystem.Arn
                Condition:
                  StringEquals: { elasticfilesystem:AccessPointArn: !GetAtt AccessPoint.Arn }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref AccessPoint, IAM: ENABLED }
      ContainerDefinitions:
        - Name: app
          Image: !Sub "${Repository.RepositoryUri}:latest"
          Essential: true
          PortMappings: [{ ContainerPort: 4100, Protocol: tcp }]
          MountPoints: [{ SourceVolume: data, ContainerPath: /data }]
          LinuxParameters: { InitProcessEnabled: true }
          Environment:
            - { Name: NODE_ENV, Value: production }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, MountTargetA, MountTargetB]
    Properties:
      ServiceName: !Sub "${AWS::StackName}"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: app, ContainerPort: 4100, TargetGroupArn: !Ref TargetGroup }

  DeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: GitHub Actions on main pushes the image and restarts the service. The name is fixed because the workflow file references it.
        must: Trust only this repository's main branch. No access keys exist.
    Properties:
      RoleName: !Sub "${AWS::StackName}-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com" }  # the accounts GitHub OIDC provider, created once outside this stack
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepoImmutable}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: push-and-restart
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:CompleteLayerUpload, ecr:InitiateLayerUpload, ecr:PutImage, ecr:UploadLayerPart, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:DescribeImages]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/${AWS::StackName}"

  OperatorRole:
    Type: AWS::IAM::Role
    Condition: HasOperator
    Metadata:
      com.aws.cloudformation.Context:
        why: Operator chores such as editing the hidden-hosts list run the service's task definition once with a command override. That needs ecs:RunTask and iam:PassRole, which the day-to-day operator principal does not have.
        must: Only this cluster and this task definition. No data permissions.
    Properties:
      RoleName: !Sub "${AWS::StackName}-operator"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref OperatorPrincipalArn }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-one-off-task
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${AWS::StackName}:*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskRole.Arn, !GetAtt ExecutionRole.Arn]
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:DescribeTasks]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/${AWS::StackName}"
                  - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${Cluster}/*"
              - Effect: Allow
                Action: ecs:DescribeTaskDefinition
                Resource: "*"
              - Effect: Allow
                Action: logs:GetLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroup}:log-stream:*"

Outputs:
  SiteUrl:
    Value: !Sub "https://${DomainName}"
  AlbDnsName:
    Description: CNAME target for DomainName (DNS only, or proxied with TLS mode Full strict).
    Value: !GetAtt LoadBalancer.DNSName
  CertificateArn:
    Value: !Ref Certificate
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  OperatorRoleArn:
    Condition: HasOperator
    Value: !GetAtt OperatorRole.Arn
