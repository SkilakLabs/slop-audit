name: Bug
description: Something in the app is broken.
title: "Bug: <short description>"
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: The URL of the page or scan involved.
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Steps to reproduce.
